<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ticket Stub – To-Do List</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>Today’s<br>tickets</h1>
  <p class="sub">Every task is a ticket. Punch it when it’s done.</p>
  <div class="punch"><div class="holes" id="holes" aria-hidden="true"></div><div class="count" id="count"></div></div>

  <div class="add">
    <input type="text" id="in" placeholder="What needs doing?" maxlength="120" aria-label="New task">
    <div class="pri" id="pri" role="group" aria-label="Priority">
      <button style="background:var(--hi)" data-p="hi" aria-label="High priority" aria-pressed="false"></button>
      <button style="background:var(--mid)" data-p="mid" aria-label="Medium priority" aria-pressed="true"></button>
      <button style="background:var(--lo)" data-p="lo" aria-label="Low priority" aria-pressed="false"></button>
    </div>
    <button class="go" id="go">Add ticket</button>
  </div>

  <div class="tabs" id="tabs">
    <button data-f="all" aria-pressed="true">All</button>
    <button data-f="open" aria-pressed="false">To do</button>
    <button data-f="done" aria-pressed="false">Done</button>
  </div>
  <ul id="list"></ul>
</main>

<script src="script.js"></script>
</body>
</html>
